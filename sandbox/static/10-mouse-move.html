<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>鼠标航迹测试</title>
<style>body{font-family:system-ui;margin:32px}.board{display:flex;justify-content:space-between;align-items:center;height:360px}.gate{display:grid;place-items:center;width:88px;height:88px;border:3px solid #607080;border-radius:50%;font-size:28px}.done{background:#d8f3e5}#result{font-weight:700}</style></head>
<body data-task-status="pending"><h1>航迹校准</h1><p>仅移动鼠标，依次经过航点 1、2、3、4、5。</p><div class="board"><div class="gate" data-step="1">1</div><div class="gate" data-step="2">2</div><div class="gate" data-step="3">3</div><div class="gate" data-step="4">4</div><div class="gate" data-step="5">5</div></div><p id="result">等待校准</p>
<script>
  let expected = 1;
  document.querySelectorAll('.gate').forEach(gate => gate.addEventListener('pointerenter', event => {
    if (event.pointerType && event.pointerType !== 'mouse') return;
    const step = Number(gate.dataset.step);
    if (step !== expected) { expected = 1; document.querySelectorAll('.gate').forEach(x => x.classList.remove('done')); return; }
    gate.classList.add('done'); expected += 1;
    if (expected === 6) { document.body.dataset.taskStatus = 'passed'; document.getElementById('result').textContent = '通过：鼠标航迹有效'; }
  }));
</script></body></html>
