<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>键盘打字测试 · 转录终端</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #e9edf0; color: #182126; display: grid; place-items: center; }
    main { width: min(900px, calc(100% - 28px)); }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 16px; }
    .eyebrow { margin: 0 0 5px; color: #20715b; font-size: 12px; font-weight: 800; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(26px, 4vw, 38px); }
    #counter { color: #637078; font-variant-numeric: tabular-nums; }
    .terminal { overflow: hidden; border: 1px solid #384249; border-radius: 7px; background: #141a1d; box-shadow: 0 16px 36px #18212622; }
    .terminal-bar { display: flex; align-items: center; justify-content: space-between; min-height: 42px; padding: 0 14px; border-bottom: 1px solid #323b40; color: #aeb9bd; font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .lights { display: flex; gap: 7px; }
    .lights i { width: 9px; height: 9px; border-radius: 50%; background: #66737a; }
    .lights i:first-child { background: #d96750; } .lights i:nth-child(2) { background: #e0b34f; } .lights i:last-child { background: #4ba77c; }
    .reference { padding: 26px 26px 6px; color: #cbd4d7; font: 16px/1.7 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .reference span { color: #75d4aa; }
    textarea { display: block; width: calc(100% - 52px); height: 155px; margin: 14px 26px 26px; resize: none; border: 1px solid #59676d; border-radius: 4px; outline: 0; padding: 16px; background: #0d1113; color: #f5f7f7; caret-color: #75d4aa; font: 17px/1.65 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 0; }
    textarea:focus { border-color: #75d4aa; box-shadow: 0 0 0 3px #75d4aa22; }
    .footer { display: flex; justify-content: space-between; gap: 18px; margin-top: 14px; color: #5e6a71; font-size: 14px; }
    #result { font-weight: 800; color: #182126; }
    body[data-task-status="passed"] #result { color: #126146; }
    @media (max-width: 600px) {
      header { align-items: start; flex-direction: column; gap: 8px; }
      .reference { padding: 20px 18px 4px; font-size: 14px; }
      textarea { width: calc(100% - 36px); margin: 12px 18px 20px; font-size: 15px; }
      .footer { align-items: start; flex-direction: column; }
    }
  </style>
</head>
<body data-task-status="pending">
  <main>
    <header><div><p class="eyebrow">Transcription / 03</p><h1>转录终端</h1></div><span id="counter">0 / 40</span></header>
    <section class="terminal">
      <div class="terminal-bar"><span>INPUT BUFFER</span><span class="lights" aria-hidden="true"><i></i><i></i><i></i></span></div>
      <div class="reference">精确转录以下两行：<br><span>Agent Fingerprint</span><br><span>MOVE CLICK TYPE SCROLL</span></div>
      <textarea id="entry" autofocus autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="转录输入区" placeholder="在此输入…"></textarea>
    </section>
    <div class="footer"><span>保留大小写，并在两行之间换行</span><span id="result" aria-live="polite">等待输入</span></div>
  </main>
  <script>
    const expected = 'Agent Fingerprint\nMOVE CLICK TYPE SCROLL';
    const entry = document.getElementById('entry');
    const counter = document.getElementById('counter');
    const result = document.getElementById('result');

    entry.addEventListener('input', () => {
      const length = [...entry.value].length;
      counter.textContent = `${length} / ${[...expected].length}`;
      if (entry.value === expected) {
        document.body.dataset.taskStatus = 'passed';
        entry.readOnly = true;
        result.textContent = '通过：转录完全一致';
      } else {
        document.body.dataset.taskStatus = 'pending';
        result.textContent = expected.startsWith(entry.value) ? '正在核对' : '内容不匹配';
      }
    });
  </script>
</body>
</html>
