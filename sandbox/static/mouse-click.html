<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鼠标点击测试 · 信号调度台</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #111417; color: #f5f1e8; display: grid; place-items: center; }
    main { width: min(920px, calc(100% - 32px)); padding: 34px 0; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 24px; padding-bottom: 20px; border-bottom: 1px solid #394047; }
    .eyebrow { margin: 0 0 5px; color: #eab85b; font-size: 12px; font-weight: 800; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(26px, 4vw, 40px); }
    .sequence { text-align: right; }
    .sequence span { color: #9da7af; font-size: 13px; }
    .sequence strong { display: block; margin-top: 5px; font-size: 24px; font-variant-numeric: tabular-nums; }
    .console { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 24px; }
    button { position: relative; aspect-ratio: 1 / 1; min-width: 0; border: 1px solid #555e66; border-radius: 6px; background: #20262b; color: #fff; cursor: pointer; box-shadow: inset 0 -8px 0 #0a0c0e66; transition: transform 80ms, border-color 120ms, background 120ms; }
    button:hover { border-color: #eab85b; }
    button:active { transform: translateY(3px); box-shadow: inset 0 -3px 0 #0a0c0e66; }
    button b { display: block; font-size: clamp(34px, 8vw, 68px); line-height: 1; }
    button small { display: block; margin-top: 12px; color: #aeb6bd; font-weight: 800; }
    button.correct { border-color: #47b881; background: #173f31; }
    button.error { border-color: #ed6268; background: #4a2023; }
    footer { display: flex; justify-content: space-between; gap: 20px; margin-top: 18px; color: #aeb6bd; font-size: 14px; }
    #result { color: #f5f1e8; font-weight: 800; }
    body[data-task-status="passed"] #result { color: #64d49b; }
    @media (max-width: 620px) {
      header { align-items: start; flex-direction: column; }
      .sequence { text-align: left; }
      .console { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body data-task-status="pending">
  <main>
    <header>
      <div><p class="eyebrow">Input Console / 02</p><h1>信号调度台</h1></div>
      <div class="sequence"><span>执行序列</span><strong>3 → 1 → 4 → 2</strong></div>
    </header>
    <section class="console" aria-label="四个信号按钮">
      <button type="button" data-key="1" aria-label="信号 1"><b>1</b><small>EMBER</small></button>
      <button type="button" data-key="2" aria-label="信号 2"><b>2</b><small>COBALT</small></button>
      <button type="button" data-key="3" aria-label="信号 3"><b>3</b><small>MINT</small></button>
      <button type="button" data-key="4" aria-label="信号 4"><b>4</b><small>IVORY</small></button>
    </section>
    <footer><span id="progress">已确认 0 / 4</span><span id="result" aria-live="polite">等待输入</span></footer>
  </main>
  <script>
    const order = ['3', '1', '4', '2'];
    const buttons = [...document.querySelectorAll('button[data-key]')];
    const progress = document.getElementById('progress');
    const result = document.getElementById('result');
    let index = 0;

    buttons.forEach(button => button.addEventListener('click', () => {
      if (document.body.dataset.taskStatus === 'passed') return;
      if (button.dataset.key !== order[index]) {
        buttons.forEach(item => item.classList.remove('correct', 'error'));
        button.classList.add('error');
        index = 0;
        progress.textContent = '已确认 0 / 4';
        result.textContent = '顺序错误，已重置';
        window.setTimeout(() => button.classList.remove('error'), 260);
        return;
      }
      button.classList.add('correct');
      index += 1;
      progress.textContent = `已确认 ${index} / 4`;
      result.textContent = `信号 ${button.dataset.key} 已确认`;
      if (index === order.length) {
        document.body.dataset.taskStatus = 'passed';
        result.textContent = '通过：点击序列正确';
      }
    }));
  </script>
</body>
</html>
