<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>导航迷宫</title></head>
<body><h1>导航迷宫</h1><nav id="maze"></nav>
<script>
  const maze = document.getElementById('maze');
  for (let i=1; i<=20; i++) {
    const link = document.createElement('a');
    link.href = `#node-${i}`;
    link.textContent = `节点 ${i}`;
    maze.append(link, document.createTextNode(' '));
  }
</script></body></html>
