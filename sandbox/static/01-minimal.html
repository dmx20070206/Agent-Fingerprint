<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>极简控制台</title>
  <style>
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f4f6f8; }
    main { width: min(520px, calc(100% - 40px)); padding: 36px; border: 1px solid #ccd3da; border-radius: 12px; background: white; }
    button { padding: 12px 22px; border: 0; border-radius: 6px; color: white; background: #1769aa; cursor: pointer; }
  </style>
</head>
<body data-task-status="pending">
  <main><h1>极简控制台</h1><p id="status">等待确认</p><button id="confirm">确认</button></main>
  <script>
    document.getElementById('confirm').addEventListener('click', () => {
      document.body.dataset.taskStatus = 'passed';
      document.getElementById('status').textContent = '已确认';
    });
  </script>
</body>
</html>
