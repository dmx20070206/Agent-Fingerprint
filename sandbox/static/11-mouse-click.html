<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>鼠标点击测试</title>
<style>body{font-family:system-ui;margin:32px}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;max-width:720px}button{height:150px;font-size:44px}#result{font-weight:700}</style></head>
<body data-task-status="pending"><h1>信号调度台</h1><p>依次点击 3、1、4、2。</p><div class="buttons"><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="4">4</button></div><p id="result">等待输入</p>
<script>
  const order = ['3', '1', '4', '2']; let index = 0;
  document.querySelectorAll('button').forEach(button => button.addEventListener('click', () => {
    if (button.dataset.key !== order[index]) { index = 0; document.getElementById('result').textContent = '顺序错误，已重置'; return; }
    index += 1;
    if (index === order.length) { document.body.dataset.taskStatus = 'passed'; document.getElementById('result').textContent = '通过：点击序列正确'; }
  }));
</script></body></html>
