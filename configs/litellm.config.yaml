model_list:
  # chat-gpt
  - model_name: chat-gpt
    litellm_params:
      model: openai/gpt-5.6-sol
      api_base: https://bmapi.020212.xyz/v1
      api_key: os.environ/RELAY_OPENAI_API_KEY
  # claude
  - model_name: claude
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_base: https://bmapi.020212.xyz
      api_key: os.environ/RELAY_ANTHROPIC_API_KEY
  # deepseek-chat
  - model_name: deepseek-chat
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
  # gemini
  - model_name: gemini
    litellm_params:
      model: openai/gemini-2.5-flash
      api_base: https://bmapi.020212.xyz/v1
      api_key: os.environ/RELAY_GEMINI_API_KEY

  # Local vLLM servers; public aliases also identify the collected LLM labels.
  - model_name: qwen3.5-9b
    litellm_params:
      model: openai/qwen3.5-9b
      api_base: http://127.0.0.1:8101/v1
      api_key: os.environ/VLLM_API_KEY
  - model_name: glm-4.6v-flash
    litellm_params:
      model: openai/glm-4.6v-flash
      api_base: http://127.0.0.1:8102/v1
      api_key: os.environ/VLLM_API_KEY
  - model_name: qwen3.5-27b
    litellm_params:
      model: openai/qwen3.5-27b
      api_base: http://127.0.0.1:8103/v1
      api_key: os.environ/VLLM_API_KEY
  - model_name: gemma-4-12b
    litellm_params:
      model: openai/gemma-4-12b
      api_base: http://127.0.0.1:8104/v1
      api_key: os.environ/VLLM_API_KEY
  - model_name: ministral-3-8b
    litellm_params:
      model: openai/ministral-3-8b
      api_base: http://127.0.0.1:8105/v1
      api_key: os.environ/VLLM_API_KEY
  - model_name: phi-4-multimodal
    litellm_params:
      model: openai/phi-4-multimodal
      api_base: http://127.0.0.1:8106/v1
      api_key: os.environ/VLLM_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  callbacks: gateway.latency_callback.proxy_handler_instance
