# Optional integration config: point LiteLLM at gateway.mock_openai instead
# of a paid provider.  Start the mock service first and export:
#   MOCK_LLM_API_BASE=http://127.0.0.1:4010/v1
#   MOCK_LLM_API_KEY=mock-key
model_list:
  - model_name: chat-gpt
    litellm_params:
      model: openai/mock-model
      api_base: os.environ/MOCK_LLM_API_BASE
      api_key: os.environ/MOCK_LLM_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  callbacks:
    - gateway.latency_callback.proxy_handler_instance
